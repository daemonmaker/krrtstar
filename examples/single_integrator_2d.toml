# 2D single integrator: state = [x, y], control = [vx, vy].
# Simplest config-driven model: A = 0, B = I. Fast to plan.

[dynamics]
kind = "linear"
x_dim = 2
u_dim = 2
A = [[0, 0], [0, 0]]
B = [[1, 0], [0, 1]]
R = [[1, 0], [0, 1]]
u_bounds = [[-3, 3], [-3, 3]]

[planner]
target_nodes = 200
connection_radius = 8.0
goal_bias = 0.15
goal_tolerance = 0.5
rewire = true
euclidean_gate = "auto"
radius_schedule = "rrtstar"
seed = 3
x_init = [-4, -4]
x_goal = [4, 4]
state_bounds = [[-5, -5], [5, 5]]

[robot]
pose_from_state = { x = 0, y = 1 }
[[robot.geometry]]
type = "sphere"
center = [0, 0, 0]
radius = 0.2

[environment]
bounds = [[-5, -5, -1], [5, 5, 1]]
[[environment.obstacles]]
type = "box"
center = [0, 0, 0]
extents = [4.0, 1.0, 2.0]

[visualization]
live = false
