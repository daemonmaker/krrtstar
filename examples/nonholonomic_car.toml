# Nonholonomic car -- the original's NONHOLONOMIC system, planned through a
# local linearization (see krrtstar/dynamics/nonlinear.py).
#
#   state   = [px, py, theta, v, kappa]   (position, heading, speed, curvature)
#   control = [a, kappa_dot]              (acceleration, steering rate)
#
# The car cannot slide sideways, so each connection linearizes the system about
# its start state and solves that linear problem exactly. The resulting
# trajectories therefore only approximately satisfy the true dynamics; set
# max_endpoint_error below to reject the worst offenders.

[dynamics]
kind = "nonholonomic"
x_dim = 5
u_dim = 2
# From the original: control_penalty = 1 and control_penalty1 = 50, i.e.
# steering is 50x more expensive than throttle.
R = [[1, 0], [0, 50]]
tau_max = 20.0
n_traj_samples = 24
# Optional: drop connections whose true-dynamics endpoint drifts further than
# this from the requested state. Off by default.
# max_endpoint_error = 3.0

[planner]
target_nodes = 300
connection_radius = 25.0
goal_bias = 0.15
goal_tolerance = 1.0
rewire = true
seed = 7
# The original started and ended at speed 1 with heading -pi/2. Here the car
# drives left to right through the passage, so heading 0 (+x) is the sensible
# equivalent; the speed of 1 is kept.
x_init = [-20, -20, 0, 1, 0]
x_goal = [20, 20, 0, 1, 0]
# Heading wraps at +-pi. Speed and curvature ranges follow the original's
# NonholonomicStateSpace, widened a little; note the heading is uncontrollable
# at v = 0, so samples near zero speed rarely connect.
state_bounds = [[-28, -28, -3.141592653589793, -2.0, -0.5],
                [28, 28, 3.141592653589793, 5.0, 0.5]]

# The "car" preset is the original's 5 x 3 x 2.5 box, offset so the state's
# position sits at a corner of the body (robots.py reproduces that offset).
[robot]
preset = "car"
pose_from_state = { x = 0, y = 1, yaw = 2 }

[environment]
bounds = [[-30, -30, -5], [30, 30, 5]]

# Two walls leaving a 12-unit passage at the origin -- wide enough for a car
# that is 5 long and 3 wide, but only if it arrives pointing the right way.
[[environment.obstacles]]
type = "box"
center = [0, 18, 0]
extents = [4, 24, 6]

[[environment.obstacles]]
type = "box"
center = [0, -18, 0]
extents = [4, 24, 6]

[visualization]
live = false
show_tree = true
show_robot = true
show_obstacles = true
keep_open = true
